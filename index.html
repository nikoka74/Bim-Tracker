<!DOCTYPE html>
<html lang="ku" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bim Company - Operations Tracker</title>
    
    <link rel="manifest" id="dynamicManifest">
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BIM Operations">

    <!-- Firebase Compat Libraries -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Custom CSS & JS -->
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div id="toast-container" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 99999;"></div>

    <div class="app-container" id="reportArea">
        <div class="app-header-bar">
            <div class="brand-box" id="headerBrandBox" style="cursor: pointer;">
                <div class="brand-logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                    </svg>
                </div>
                <div>
                    <h1>BIM Operations</h1>
                    <p id="lblSubHeader">سیستمی بەڕێوەبردنی ئامار</p>
                </div>
            </div>
            
            <div class="top-tools">
                <div class="tools-left-group">
                    <button id="installAppBtn" class="tool-btn install-btn" onclick="installPwaApp()">📲 داگرتن</button>
                    <!-- 🔐 دوگمەی ئاشکرای ئەدمین بۆ چوونەژوورەوەی خێرا -->
                    <button class="tool-btn" onclick="openAdminAuthModal()" style="background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #f87171; font-weight: bold;">🔐 ئەدمین</button>
                </div>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <button class="tool-btn refresh-btn" onclick="refreshData()" id="btnRefreshMain">
                        <span>نوێکردنەوە</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="section-tabs">
            <button class="section-tab-btn active" id="tabLFD" onclick="switchSection('lfd')">بەشی LFD</button>
            <button class="section-tab-btn" id="tabMoveIn" onclick="switchSection('movein')">بەشی Move-In</button>
            <button class="section-tab-btn" id="tabChat" onclick="switchSection('chat')" style="background: rgba(56, 189, 248, 0.15); border-color: var(--primary);">💬 چاتی گشتی</button>
        </div>

        <!-- OPERATIONS TRACKER MAIN WRAPPER -->
        <div id="operationsMainWrapper">
            <div class="total-points-card" id="totalPointsCard">
                <div class="trend-header-row">
                    <h3 id="lblGrandTotalTitle">جۆرەکان و کۆی گشتی ئەمڕۆ</h3>
                    <span id="grandTotalPoints" class="counter">0</span>
                </div>
            </div>

            <!-- MAIN FORM SECTION -->
            <div class="control-group">
                <label for="teamSelect" id="lblSelectTeam">تیمەکەت هەڵبژێرە:</label>
                <div style="display: flex; gap: 6px;">
                    <select id="teamSelect" style="flex: 2;">
                        <option value="" id="optChooseTeam">-- تیم هەڵبژێرە --</option>
                    </select>
                </div>

                <div class="cases-grid" id="casesGridContainer"></div>

                <button class="btn-submit-main" id="btnSave" onclick="submitMainForm()" style="margin-top: 15px;">
                    <span id="btnSubmitText">ناردنی ڕاپۆرت</span>
                </button>
            </div>

            <!-- FULL ADMIN PANEL (شاردراوەتەوە تا پاسۆرد لێدەدرێت) -->
            <div class="admin-panel" id="adminPanel" style="display: none; margin-top: 20px; padding: 15px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--primary); border-radius: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="font-size:14px; color:var(--primary); font-weight: 700;">بەشی بەڕێوەبەر (Admin Panel)</h3>
                    <button class="tool-btn" onclick="toggleAdminPanel(false)" style="background: #ef4444; color: white;">داخستنی ئەدمین</button>
                </div>

                <!-- Audit Logs List -->
                <div class="admin-sub-box" style="margin-bottom: 12px;">
                    <label style="font-size: 11px; color: var(--primary); font-weight: bold;">📱 تێبینی و لۆگی ڕاستەوخۆ (ئامێرەکانی نێرەر):</label>
                    <div id="adminLogsList" style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 250px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>

        <!-- CHAT SECTION -->
        <div id="chatSectionContainer" class="chat-section-container" style="display:none;">
            <div class="chat-messages-area" id="chatMessagesArea"></div>
            <div class="chat-input-bar">
                <input type="text" id="chatMessageInput" placeholder="پەیامەکەت بنووسە..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button class="btn" onclick="sendChatMessage()">ناردن</button>
            </div>
        </div>

        <div class="site-footer-copy">
            All rights reserved by Nihad Salih Hussain
        </div>
    </div>
</body>
</html>
