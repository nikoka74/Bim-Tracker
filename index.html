<!DOCTYPE html>
<html lang="ku" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bim Company - Operations Tracker</title>
    
    <link rel="manifest" id="dynamicManifest">
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BIM Operations">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-color: #090d16;
            --card-bg: rgba(17, 28, 46, 0.75);
            --text-color: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(11, 15, 25, 0.8);
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --glass-shadow: 0 16px 32px 0 rgba(0, 0, 0, 0.4);
            --backdrop-blur: blur(16px);
        }

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 0; }
        
        body { 
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 60%);
            background-attachment: fixed;
            color: var(--text-color); 
            padding: 16px; 
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease; 
        }

        .app-container { 
            max-width: 650px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            backdrop-filter: var(--backdrop-blur);
            -webkit-backdrop-filter: var(--backdrop-blur);
            border-radius: 20px; 
            padding: 20px; 
            box-shadow: var(--glass-shadow); 
            border: 1px solid var(--border-color); 
        }
        
        /* گۆڕانکاری بۆ ڕێکخستنی لۆگۆ و دەقەکان لەسەر مۆبایل */
        .app-header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 14px; gap: 4px; }
        .brand-box { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; min-width: 0; flex: 1; overflow: hidden; }
        .brand-logo { width: 32px; height: 32px; object-fit: contain; border-radius: 6px; flex-shrink: 0; background: rgba(255,255,255,0.08); padding: 3px; border: 1px solid rgba(255,255,255,0.15); display: block !important; visibility: visible !important; }
        .brand-box div { min-width: 0; flex: 1; }
        .brand-box h1 { font-size: 13px; color: var(--primary); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .brand-box p { font-size: 9px; opacity: 0.7; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .top-tools { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .tool-btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--border-color); 
            padding: 5px 8px; 
            border-radius: 8px; 
            cursor: pointer; 
            color: var(--text-color); 
            font-weight: 500; 
            font-size: 10px; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            outline: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }
        .tool-btn:hover { background: var(--primary); color: #090d16; border-color: var(--primary); box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); transform: translateY(-1px); }
        .install-btn { background: #10b981; color: white; border-color: #10b981; display: none; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .refresh-btn.spinning svg { animation: spin 0.6s linear; }

        .total-points-card {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.8) 0%, rgba(124, 58, 237, 0.8) 50%, rgba(219, 39, 119, 0.8) 100%);
            backdrop-filter: blur(12px);
            color: white;
            padding: 20px 24px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 15px 30px -5px rgba(124, 58, 237, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
        }
        .total-points-card::after {
            content: '';
            position: absolute;
            top: -50%; right: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        .total-points-card.movein-theme {
            background: linear-gradient(135deg, rgba(4, 120, 87, 0.85) 0%, rgba(5, 150, 105, 0.85) 50%, rgba(16, 185, 129, 0.85) 100%);
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }
        .total-points-card .icon-container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4);
        }
        .total-points-card h3 {
            margin: 0 0 4px 0;
            font-size: 13px;
            font-weight: 600;
            opacity: 0.95;
            letter-spacing: 0.3px;
        }
        .total-points-card .counter {
            font-size: 32px;
            font-weight: 800;
            line-height: 1;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .broadcast-ticker { background: rgba(220, 38, 38, 0.85); backdrop-filter: blur(8px); color: white; padding: 10px 14px; border-radius: 10px; font-size: 11px; margin-bottom: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(220,38,38,0.3); border: 1px solid rgba(255,255,255,0.15); }
        .broadcast-ticker.active-new { background: rgba(16, 185, 129, 0.9) !important; box-shadow: 0 4px 15px rgba(16,185,129,0.4); }

        .progress-container { margin-bottom: 16px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; height: 16px; overflow: hidden; position: relative; border: 1px solid var(--border-color); }
        .progress-bar { background: linear-gradient(90deg, #10b981, #34d399); height: 100%; width: 0%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .progress-text { position: absolute; width: 100%; text-align: center; font-size: 10px; font-weight: 700; line-height: 16px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

        .control-group { background: rgba(17, 28, 46, 0.5); backdrop-filter: blur(10px); padding: 16px; border-radius: 16px; margin-bottom: 14px; border: 1px solid var(--border-color); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); }
        label { font-size: 11px; font-weight: 600; display: block; margin-bottom: 6px; color: var(--text-color); opacity: 0.9; }
        select, input, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 12px; outline: none; background: var(--input-bg); color: var(--text-color); transition: all 0.3s ease; backdrop-filter: blur(8px); }
        select:focus, input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }

        .section-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
        .section-tab-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); padding: 10px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; color: var(--text-color); text-align: center; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(8px); }
        .section-tab-btn.active { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border-color: #38bdf8; box-shadow: 0 0 20px rgba(2, 132, 199, 0.5); transform: translateY(-1px); }

        .cases-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; margin-bottom: 14px; }
        .case-item { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color); padding: 10px 8px; border-radius: 12px; font-size: 11px; text-align: center; font-weight: 600; backdrop-filter: blur(8px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .case-item:hover { border-color: var(--primary); transform: translateY(-2px); }
        .case-item input { text-align: center; font-weight: 700; padding: 8px; font-size: 14px; margin-top: 8px; background: rgba(11, 15, 25, 0.95); border: 1px solid rgba(255,255,255,0.12); }

        .offday-container { display: flex; align-items: center; gap: 10px; margin-top: 14px; background: rgba(245, 158, 11, 0.08); padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.25); }
        .offday-container input { width: 20px; height: 20px; accent-color: #f59e0b; cursor: pointer; }
        .offday-container label { margin-bottom: 0; color: #f59e0b; font-weight: 700; cursor: pointer; font-size: 12px; }

        .btn { width: 100%; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4); border: 1px solid rgba(255,255,255,0.15); }
        .btn:hover { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); box-shadow: 0 12px 25px rgba(14, 165, 233, 0.6); transform: translateY(-2px); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 17, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
        .modal-content { background: rgba(17, 28, 46, 0.95); border: 1px solid var(--border-color); padding: 22px; border-radius: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .modal-header h3 { font-size: 15px; color: var(--primary); font-weight: 700; }
        .close-modal { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-color); width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .close-modal:hover { background: #ef4444; border-color: #ef4444; color: white; }

        .table-container { overflow-x: auto; margin-top: 10px; border-radius: 10px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: right; white-space: nowrap; }
        th, td { padding: 9px 12px; border-bottom: 1px solid var(--border-color); }
        th { background: rgba(255, 255, 255, 0.05); font-weight: 700; color: var(--primary); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .history-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 8px; font-size: 11px; }
        .history-info { display: flex; flex-direction: column; gap: 2px; }
        .history-date { font-weight: 700; color: var(--primary); }
        .history-details { opacity: 0.8; font-size: 10px; }
        .delete-record-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 10px; font-weight: 600; transition: all 0.2s; }
        .delete-record-btn:hover { background: #ef4444; color: white; }

        .pin-inputs { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
        .pin-digit { width: 45px; height: 50px; text-align: center; font-size: 20px; font-weight: bold; border-radius: 10px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); }
        .pin-digit:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); color: white; padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); font-size: 11px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header Bar -->
        <div class="app-header-bar">
            <div class="brand-box" onclick="openAdminModal()">
                <img src="" alt="Logo" class="brand-logo" id="headerLogoImg" style="display:none;">
                <div>
                    <h1 id="headerTitle">BIM Operations</h1>
                    <p id="headerSubtitle">سیستمی بەڕێوەبردن و ئامار</p>
                </div>
            </div>
            <div class="top-tools">
                <button class="tool-btn install-btn" id="installPWABtn" onclick="installPWA()">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    دابەزێنە
                </button>
                <button class="tool-btn refresh-btn" id="refreshBtn" onclick="manualRefresh()" title="نوێکردنەوە">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    نوێکردنەوە
                </button>
                <button class="tool-btn" onclick="openHistoryModal()">مێژوو</button>
                <button class="tool-btn" onclick="openReportModal()">ڕاپۆرت</button>
            </div>
        </div>

        <!-- Total Points Card -->
        <div class="total-points-card" id="totalPointsCard">
            <div class="icon-container">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
            </div>
            <div>
                <h3 id="totalPointsTitle">کۆی گشتی خاڵەکان</h3>
                <div class="counter" id="totalPointsVal">0</div>
            </div>
        </div>

        <!-- Broadcast Ticker -->
        <div class="broadcast-ticker" id="broadcastTicker" style="display: none;">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
            <span id="broadcastText"></span>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- Section Tabs -->
        <div class="section-tabs">
            <button class="section-tab-btn active" id="tabInspection" onclick="switchSection('inspection')">پشکنین و ئامار</button>
            <button class="section-tab-btn" id="tabMoveIn" onclick="switchSection('movein')">چوونە ژوورەوە (Move-In)</button>
        </div>

        <!-- Main Form -->
        <form id="statsForm" onsubmit="saveData(event)">
            <div class="control-group">
                <label for="employeeSelect">ناو / کارمەند</label>
                <select id="employeeSelect" required onchange="onEmployeeChange()"></select>
            </div>

            <div class="control-group">
                <label for="dateInput">بەڕێوەچوونی ڕێکەوت</label>
                <input type="date" id="dateInput" required onchange="checkDateRecord()">
            </div>

            <!-- Inspection Fields Container -->
            <div id="inspectionFieldsContainer">
                <div class="cases-grid" id="casesGrid"></div>
            </div>

            <!-- Move-In Fields Container -->
            <div id="moveInFieldsContainer" style="display: none;">
                <div class="control-group" style="background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2);">
                    <label for="moveInCount" style="color: #34d399;">ژمارەی خانووی چوونە ژوورەوە (Move-In)</label>
                    <input type="number" id="moveInCount" min="0" value="0" placeholder="ژمارە بنووسە..." style="font-size: 16px; font-weight: 700; text-align: center;">
                </div>
            </div>

            <div class="offday-container" id="offDayContainer">
                <input type="checkbox" id="isOffDay" onchange="toggleOffDay()">
                <label for="isOffDay">پشووی فەرمی (Off-Day)</label>
            </div>

            <div class="control-group" style="margin-top: 14px;">
                <label for="notesInput">تێبینی یان تێڕوانینی ڕۆژانە</label>
                <textarea id="notesInput" rows="2" placeholder="هەر تێبینییەک یان کارێک ئەنجامدراوە..."></textarea>
            </div>

            <button type="submit" class="btn" id="submitBtn">تۆمارکردنی داتا</button>
        </form>
    </div>

    <!-- Modals -->
    <!-- History Modal -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>مێژووی تۆمارکراوەکانی ٧ ڕۆژی ڕابردوو</h3>
                <button class="close-modal" onclick="closeHistoryModal()">✕</button>
            </div>
            <div id="historyListContainer"></div>
        </div>
    </div>

    <!-- Report Modal -->
    <div class="modal" id="reportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>ڕاپۆرت و ئاماری گشتی</h3>
                <button class="close-modal" onclick="closeReportModal()">✕</button>
            </div>
            <div style="margin-bottom: 12px;">
                <label for="reportFilterSelect">فلتەر بەپێی کارمەند</label>
                <select id="reportFilterSelect" onchange="updateReportData()"></select>
            </div>
            <div id="reportSummaryBox" style="font-size: 11px; line-height: 1.6; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 12px;"></div>
            <div style="height: 200px; position: relative;">
                <canvas id="reportChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Admin / Settings Modal (Protected by PIN) -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div class="modal-header">
                <h3>بەڕێوەبردنی سیستم (ڕێکخستنەکان)</h3>
                <button class="close-modal" onclick="closeAdminModal()">✕</button>
            </div>
            <div id="pinEntryView">
                <p style="font-size: 12px; opacity: 0.8; margin-bottom: 12px;">تکایە پین کۆدی بەڕێوەبەر بنووسە:</p>
                <div class="pin-inputs">
                    <input type="password" maxlength="1" class="pin-digit" id="pin1" oninput="moveToNextPin(this, 'pin2')">
                    <input type="password" maxlength="1" class="pin-digit" id="pin2" oninput="moveToNextPin(this, 'pin3')" onkeydown="checkPinBackspace(event, 'pin1')">
                    <input type="password" maxlength="1" class="pin-digit" id="pin3" oninput="moveToNextPin(this, 'pin4')" onkeydown="checkPinBackspace(event, 'pin2')">
                    <input type="password" maxlength="1" class="pin-digit" id="pin4" oninput="verifyAdminPin()" onkeydown="checkPinBackspace(event, 'pin3')">
                </div>
            </div>
            <div id="adminPanelView" style="display: none; text-align: right;">
                <div class="control-group">
                    <label for="adminEmpName">زیادکردنی کارمەندی نوێ</label>
                    <div style="display: flex; gap: 6px;">
                        <input type="text" id="adminEmpName" placeholder="ناوی کارمەند...">
                        <button class="tool-btn" onclick="addNewEmployee()" style="padding: 10px 14px;">زیادکردن</button>
                    </div>
                </div>
                <div class="control-group">
                    <label for="adminBroadcastInput">پەیامی پەخشی گشتی (Broadcast)</label>
                    <textarea id="adminBroadcastInput" rows="2" placeholder="پەیام بنووسە بۆ هەمووان..."></textarea>
                    <button class="tool-btn" onclick="saveBroadcast()" style="margin-top: 8px; width: 100%; justify-content: center;">ناردنی پەخش</button>
                </div>
                <div class="control-group">
                    <label>سڕینەوەی داتای کارمەندێک یان گۆڕینی ڕێکخستنەکان</label>
                    <button class="delete-record-btn" onclick="resetAllData()" style="width: 100%; padding: 10px; margin-top: 4px;">ڕێستکردنەوەی گشتی داتا</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastMessage"></div>

    <!-- Script Application Logic -->
    <script>
        const firebaseConfig = {
            databaseURL: "https://bim-operations-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentSection = 'inspection';
        let employees = ["ئارام", "کاروان", "شیلان", "محمد", "بەختیار"];
        let inspectionCasesConfig = [
            { id: 'case1', label: 'کەیسی ئاسایی', points: 1 },
            { id: 'case2', label: 'کەیسی ناوەند', points: 2 },
            { id: 'case3', label: 'کەیسی قورس', points: 3 },
            { id: 'case4', label: 'پشکنینی گشتی', points: 2 },
            { id: 'case5', label: 'چاککردنەوەی خێرا', points: 1 },
            { id: 'case6', label: 'سەردانی مەیدانی', points: 4 }
        ];
        let appSettings = { title: "BIM Operations", subtitle: "سیستمی بەڕێوەبردن و ئامار", logoUrl: "", pinCode: "1234", broadcast: "" };
        let allRecords = {};
        let deferredPrompt = null;
        let chartInstance = null;

        window.onload = function() {
            initDate();
            renderInspectionCases();
            loadSettingsFromFirebase();
            loadDataFromFirebase();
            setupPWAInstall();
        };

        function initDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateInput').value = today;
        }

        function renderInspectionCases() {
            const grid = document.getElementById('casesGrid');
            grid.innerHTML = '';
            inspectionCasesConfig.forEach(c => {
                const item = document.createElement('div');
                item.className = 'case-item';
                item.innerHTML = `
                    <div>${c.label} (${c.points} خ)</div>
                    <input type="number" id="${c.id}" min="0" value="0" oninput="calculateTotalLive()">
                `;
                grid.appendChild(item);
            });
        }

        function switchSection(section) {
            currentSection = section;
            document.getElementById('tabInspection').classList.toggle('active', section === 'inspection');
            document.getElementById('tabMoveIn').classList.toggle('active', section === 'movein');
            
            document.getElementById('inspectionFieldsContainer').style.display = section === 'inspection' ? 'block' : 'none';
            document.getElementById('moveInFieldsContainer').style.display = section === 'movein' ? 'block' : 'none';
            
            const card = document.getElementById('totalPointsCard');
            const title = document.getElementById('totalPointsTitle');
            if(section === 'movein') {
                card.classList.add('movein-theme');
                title.innerText = 'کۆی گشتی خانووەکان (Move-In)';
            } else {
                card.classList.remove('movein-theme');
                title.innerText = 'کۆی گشتی خاڵەکان';
            }
            calculateTotalLive();
        }

        function calculateTotalLive() {
            let total = 0;
            if (currentSection === 'inspection') {
                inspectionCasesConfig.forEach(c => {
                    const val = parseInt(document.getElementById(c.id)?.value) || 0;
                    total += val * (c.points || 1);
                });
            } else {
                total = parseInt(document.getElementById('moveInCount')?.value) || 0;
            }
            document.getElementById('totalPointsVal').innerText = total;
            updateProgressBar(total);
        }

        function updateProgressBar(val) {
            const maxTarget = currentSection === 'inspection' ? 50 : 20;
            let percent = Math.min(Math.round((val / maxTarget) * 100), 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = percent + '%';
        }

        function toggleOffDay() {
            const isOff = document.getElementById('isOffDay').checked;
            if(currentSection === 'inspection') {
                inspectionCasesConfig.forEach(c => {
                    const el = document.getElementById(c.id);
                    if(el) { el.value = 0; el.disabled = isOff; }
                });
            } else {
                const moveInEl = document.getElementById('moveInCount');
                if(moveInEl) { moveInEl.value = 0; moveInEl.disabled = isOff; }
            }
            calculateTotalLive();
        }

        function loadSettingsFromFirebase() {
            db.ref('settings').on('value', snapshot => {
                const data = snapshot.val();
                if(data) {
                    appSettings = { ...appSettings, ...data };
                    document.getElementById('headerTitle').innerText = appSettings.title;
                    document.getElementById('headerSubtitle').innerText = appSettings.subtitle;
                    if(appSettings.logoUrl) {
                        const logoImg = document.getElementById('headerLogoImg');
                        logoImg.src = appSettings.logoUrl;
                        logoImg.style.display = 'block';
                    }
                    if(appSettings.broadcast) {
                        document.getElementById('broadcastText').innerText = appSettings.broadcast;
                        document.getElementById('broadcastTicker').style.display = 'flex';
                    } else {
                        document.getElementById('broadcastTicker').style.display = 'none';
                    }
                }
            });
        }

        function loadDataFromFirebase() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            db.ref('records').on('value', snapshot => {
                allRecords = snapshot.val() || {};
                
                let empSet = new Set(employees);
                Object.values(allRecords).forEach(rec => {
                    if(rec.employee) empSet.add(rec.employee);
                });
                employees = Array.from(empSet);
                updateEmployeeDropdowns();
                checkDateRecord();
                btn.classList.remove('spinning');
            }, error => {
                btn.classList.remove('spinning');
            });
        }

        function updateEmployeeDropdowns() {
            const select = document.getElementById('employeeSelect');
            const reportSelect = document.getElementById('reportFilterSelect');
            
            const currentEmp = select.value;
            const currentRepEmp = reportSelect.value;
            
            select.innerHTML = '<option value="" disabled selected>کارمەند هەڵبژێرە...</option>';
            reportSelect.innerHTML = '<option value="all">گشتی (هەموو کارمەندەکان)</option>';
            
            employees.forEach(emp => {
                select.innerHTML += `<option value="${emp}">${emp}</option>`;
                reportSelect.innerHTML += `<option value="${emp}">${emp}</option>`;
            });
            
            if(currentEmp) select.value = currentEmp;
            if(currentRepEmp) reportSelect.value = currentRepEmp;
        }

        function onEmployeeChange() {
            checkDateRecord();
        }

        function checkDateRecord() {
            const emp = document.getElementById('employeeSelect').value;
            const date = document.getElementById('dateInput').value;
            if(!emp || !date) return;

            const recordKey = `${emp}_${date}`;
            const record = allRecords[recordKey];
            
            if(record) {
                if(record.type === 'inspection' || !record.type) {
                    switchSection('inspection');
                    inspectionCasesConfig.forEach(c => {
                        const el = document.getElementById(c.id);
                        if(el) el.value = record.cases?.[c.id] || 0;
                    });
                } else {
                    switchSection('movein');
                    document.getElementById('moveInCount').value = record.moveInCount || 0;
                }
                document.getElementById('isOffDay').checked = !!record.isOffDay;
                document.getElementById('notesInput').value = record.notes || '';
                document.getElementById('submitBtn').innerText = 'نوێکردنەوەی داتا';
                toggleOffDayState(record.isOffDay);
            } else {
                resetFormFieldsValues();
                document.getElementById('submitBtn').innerText = 'تۆمارکردنی داتا';
            }
            calculateTotalLive();
        }

        function toggleOffDayState(isOff) {
            const offCheck = document.getElementById('isOffDay');
            offCheck.checked = isOff;
            if(currentSection === 'inspection') {
                inspectionCasesConfig.forEach(c => {
                    const el = document.getElementById(c.id);
                    if(el) el.disabled = isOff;
                });
            } else {
                document.getElementById('moveInCount').disabled = isOff;
            }
        }

        function resetFormFieldsValues() {
            inspectionCasesConfig.forEach(c => {
                const el = document.getElementById(c.id);
                if(el) el.value = 0;
            });
            document.getElementById('moveInCount').value = 0;
            document.getElementById('isOffDay').checked = false;
            document.getElementById('notesInput').value = '';
            toggleOffDayState(false);
        }

        function saveData(e) {
            e.preventDefault();
            const emp = document.getElementById('employeeSelect').value;
            const date = document.getElementById('dateInput').value;
            const isOffDay = document.getElementById('isOffDay').checked;
            const notes = document.getElementById('notesInput').value;

            if(!emp) {
                showToast('تکایە ناوی کارمەند هەڵبژێرە!');
                return;
            }

            let recordData = {
                employee: emp,
                date: date,
                type: currentSection,
                isOffDay: isOffDay,
                notes: notes,
                timestamp: Date.now()
            };

            if(currentSection === 'inspection') {
                let cases = {};
                let totalPts = 0;
                inspectionCasesConfig.forEach(c => {
                    const val = parseInt(document.getElementById(c.id)?.value) || 0;
                    cases[c.id] = val;
                    totalPts += val * (c.points || 1);
                });
                recordData.cases = cases;
                recordData.totalPoints = totalPts;
            } else {
                const count = parseInt(document.getElementById('moveInCount')?.value) || 0;
                recordData.moveInCount = count;
                recordData.totalPoints = count;
            }

            const recordKey = `${emp}_${date}`;
            db.ref('records/' + recordKey).set(recordData).then(() => {
                showToast('داتا بە سەرکەوتوویی پاشەکەوت کرا!');
            }).catch(err => {
                showToast('هەڵە ڕویدا لە پاشەکەوتکردن!');
            });
        }

        function manualRefresh() {
            loadDataFromFirebase();
            showToast('سیستم نوێکرایەوە');
        }

        function openHistoryModal() {
            const container = document.getElementById('historyListContainer');
            container.innerHTML = '';
            
            const recordsArr = Object.entries(allRecords).map(([key, val]) => ({ key, ...val }));
            recordsArr.sort((a, b) => b.timestamp - a.timestamp);
            
            if(recordsArr.length === 0) {
                container.innerHTML = '<p style="text-align:center; font-size:11px; opacity:0.7; padding:15px;">هیچ تۆمارێک نییە.</p>';
            } else {
                recordsArr.slice(0, 20).forEach(rec => {
                    const div = document.createElement('div');
                    div.className = 'history-row';
                    div.innerHTML = `
                        <div class="history-info">
                            <span class="history-date">${rec.employee} - ${rec.date}</span>
                            <span class="history-details">${rec.isOffDay ? 'پشووی فەرمی' : (rec.type === 'movein' ? 'Move-In: ' + rec.moveInCount : 'خاڵەکان: ' + rec.totalPoints)} | ${rec.notes || 'بێ تێبینی'}</span>
                        </div>
                        <button class="delete-record-btn" onclick="deleteRecord('${rec.key}')">سڕینەوە</button>
                    `;
                    container.appendChild(div);
                });
            }
            document.getElementById('historyModal').style.display = 'flex';
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').style.display = 'none';
        }

        function deleteRecord(key) {
            if(confirm('دڵنیایت لە سڕینەوەی ئەم تۆمارە؟')) {
                db.ref('records/' + key).remove().then(() => {
                    showToast('تۆمارەکە سڕایەوە');
                    openHistoryModal();
                });
            }
        }

        function openReportModal() {
            updateReportData();
            document.getElementById('reportModal').style.display = 'flex';
        }

        function closeReportModal() {
            document.getElementById('reportModal').style.display = 'none';
        }

        function updateReportData() {
            const filterEmp = document.getElementById('reportFilterSelect').value;
            const recordsArr = Object.values(allRecords);
            
            let filtered = filterEmp === 'all' ? recordsArr : recordsArr.filter(r => r.employee === filterEmp);
            
            let totalPointsSum = 0;
            let totalMoveInSum = 0;
            let offDaysCount = 0;
            
            filtered.forEach(r => {
                if(r.isOffDay) offDaysCount++;
                if(r.type === 'movein') totalMoveInSum += (r.moveInCount || 0);
                else totalPointsSum += (r.totalPoints || 0);
            });
            
            const summaryBox = document.getElementById('reportSummaryBox');
            summaryBox.innerHTML = `
                <b>کۆی گشتی خاڵەکانی پشکنین:</b> ${totalPointsSum}<br>
                <b>کۆی گشتی خانووەکانی Move-In:</b> ${totalMoveInSum}<br>
                <b>ژمارەی ڕۆژە پشووەکان:</b> ${offDaysCount}<br>
                <b>کۆی گشتی ڕۆژە تۆمارکراوەکان:</b> ${filtered.length}
            `;
            
            renderChart(filtered);
        }

        function renderChart(records) {
            const ctx = document.getElementById('reportChart').getContext('2d');
            
            let dateMap = {};
            records.forEach(r => {
                dateMap[r.date] = (dateMap[r.date] || 0) + (r.totalPoints || 0);
            });
            
            let sortedDates = Object.keys(dateMap).sort();
            let dataPoints = sortedDates.map(d => dateMap[d]);
            
            if(chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedDates,
                    datasets: [{
                        label: 'کۆی خاڵەکان بەپێی ڕێکەوت',
                        data: dataPoints,
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#f8fafc', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: '#f8fafc', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        function openAdminModal() {
            document.getElementById('pin1').value = '';
            document.getElementById('pin2').value = '';
            document.getElementById('pin3').value = '';
            document.getElementById('pin4').value = '';
            document.getElementById('pinEntryView').style.display = 'block';
            document.getElementById('adminPanelView').style.display = 'none';
            document.getElementById('adminModal').style.display = 'flex';
            setTimeout(() => document.getElementById('pin1').focus(), 100);
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function moveToNextPin(current, nextId) {
            if(current.value.length >= 1) {
                document.getElementById(nextId)?.focus();
            }
        }

        function checkPinBackspace(event, prevId) {
            if(event.key === 'Backspace' && event.target.value === '') {
                document.getElementById(prevId)?.focus();
            }
        }

        function verifyAdminPin() {
            const p1 = document.getElementById('pin1').value;
            const p2 = document.getElementById('pin2').value;
            const p3 = document.getElementById('pin3').value;
            const p4 = document.getElementById('pin4').value;
            const enteredPin = p1 + p2 + p3 + p4;
            
            if(enteredPin === (appSettings.pinCode || "1234")) {
                document.getElementById('pinEntryView').style.display = 'none';
                document.getElementById('adminPanelView').style.display = 'block';
                document.getElementById('adminBroadcastInput').value = appSettings.broadcast || '';
            } else if(enteredPin.length === 4) {
                showToast('پین کۆدی هەڵەیە!');
                document.getElementById('pin1').value = '';
                document.getElementById('pin2').value = '';
                document.getElementById('pin3').value = '';
                document.getElementById('pin4').value = '';
                document.getElementById('pin1').focus();
            }
        }

        function addNewEmployee() {
            const name = document.getElementById('adminEmpName').value.trim();
            if(name && !employees.includes(name)) {
                employees.push(name);
                updateEmployeeDropdowns();
                document.getElementById('adminEmpName').value = '';
                showToast('کارمەند زیادکرا');
            } else {
                showToast('ناوەکە هەڵەیە یان پێشتر هەیە');
            }
        }

        function saveBroadcast() {
            const msg = document.getElementById('adminBroadcastInput').value.trim();
            db.ref('settings/broadcast').set(msg).then(() => {
                showToast('پەخشی گشتی نوێکرایەوە');
            });
        }

        function resetAllData() {
            if(confirm('ئاگاداری: ئەم کارە هەموو داتاکان دەسڕێتەوە! دڵنیایت؟')) {
                db.ref('records').remove().then(() => {
                    showToast('داتاکان ڕێست کرانەوە');
                    closeAdminModal();
                });
            }
        }

        function setupPWAInstall() {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('installPWABtn').style.display = 'flex';
            });
        }

        function installPWA() {
            if(deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if(choiceResult.outcome === 'accepted') {
                        document.getElementById('installPWABtn').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
